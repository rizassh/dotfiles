general {
    # SDDM needs to know which command to run when it gets a lock signal
    lock_cmd = pidof hyprlock || hyprlock       
    
    # This sends the signal to SDDM/logind to trigger the lock_cmd
    before_sleep_cmd = loginctl lock-session    
    
    # CRITICAL: This prevents the 'black screen' or 'no lock' on wake
    after_sleep_cmd = hyprctl dispatch dpms on  
    
    # This makes the system wait for hyprlock to start before sleeping
    inhibit_sleep = 1
}

# Optional: Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Optional: Suspend after 10 minutes
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
